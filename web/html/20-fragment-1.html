
<!-- Async Export Progress Modal -->
<div id="export-progress-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center">
  <div style="background:var(--card-bg);border-radius:16px;padding:28px 32px;min-width:300px;max-width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <div id="export-progress-icon" style="font-size:32px;margin-bottom:12px">&#x23F3;</div>
    <div id="export-progress-title" style="font-weight:700;font-size:15px;color:var(--text-primary);margin-bottom:6px">Preparing Export&#x2026;</div>
    <div id="export-progress-sub" style="font-size:12px;color:var(--text-secondary);margin-bottom:16px">This may take a few seconds</div>
    <div style="background:var(--border);border-radius:99px;height:6px;overflow:hidden">
      <div id="export-progress-bar-fill" style="background:linear-gradient(90deg,var(--accent),#8b5cf6);height:100%;width:0%;border-radius:99px;transition:width .3s ease"></div>
    </div>
    <div id="export-progress-pct" style="font-size:11px;color:var(--text-muted);margin-top:8px">0%</div>
  </div>
</div>

<!-- Smart Cleanup Wizard Modal -->
<div id="cleanup-wizard-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9998;align-items:center;justify-content:center">
  <div style="background:var(--card-bg);border-radius:16px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)">
    <div style="padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-weight:800;font-size:16px;color:var(--text-primary)">✨ Smart Clean Wizard</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-top:2px" id="wizard-step-label">Scanning your data...</div>
      </div>
      <button onclick="closeCleanupWizard()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-muted);line-height:1;padding:4px">&times;</button>
    </div>
    <div id="wizard-scan-results" style="padding:20px 24px;min-height:100px"></div>
    <div style="padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end">
      <button class="tb-btn" onclick="closeCleanupWizard()">Close / बंद करें</button>
      <button class="tb-btn primary" id="wizard-fix-all-btn" onclick="wizardFixAll()" style="display:none">
        ✅ Fix All / सभी ठीक करें
      </button>
    </div>
  </div>
</div>
