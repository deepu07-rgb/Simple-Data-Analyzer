<!-- ================================================================
  Stellura — Data Vision Studio  |  Single-file SPA
  SYNC RULE: download/Simple-Data-Analyser.html and
             public/Simple-Data-Analyser.html MUST remain byte-identical.
  Verify (PowerShell before every commit):
    $a=(Get-FileHash 'download\Simple-Data-Analyser.html').Hash
    $b=(Get-FileHash 'public\Simple-Data-Analyser.html').Hash
    if($a -ne $b){throw 'FILES OUT OF SYNC'}

  • Removed legacy left icon rail: #sidebar HTML + all sidebar CSS blocks
  • Removed .mobile-toggle hamburger button (sidebar gone)
  • Stripped sidebar icon activation lines from switchTool()
  • Made toggleSidebar() a no-op (no remaining callers)
  • Added ⚙ Settings button to commandbar so panel stays reachable
  • Debounced _ddSaveNodes() with 400 ms timer (reduces localStorage churn)
  • RAF-gated _ddRedrawEdges() inside _ddNodeDragMove() (one redraw/frame)
================================================================ -->
