name: Tests (Windows and Linux)

# Every push and pull request runs the whole test set on a real Windows machine and on Linux:
# server tests (pytest), browser-logic tests (node --test), and the browser suites (Playwright, Chromium)
# against the running app with all outside network blocked by the tests themselves.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PORT: "5055"
      PYTHONUTF8: "1"
      PY: python
      PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest statsmodels pypdf

      - name: Build the app page
        run: python tools/build.py

      - name: Server tests (pytest)
        run: python -m pytest -q

      - name: Browser-logic tests (node --test)
        run: node --test tests/unit/*.test.js

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.63.0
          if [ "$RUNNER_OS" = "Linux" ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi

      - name: Start the app
        run: |
          mkdir -p "$RUNNER_TEMP/stl-home"
          STELLURA_HOME="$RUNNER_TEMP/stl-home" nohup python app.py > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -s -o /dev/null "http://127.0.0.1:$PORT/"; then echo "app is up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "the app did not start"; cat "$RUNNER_TEMP/server.log"; exit 1

      - name: Browser suites (Playwright)
        run: |
          failed=0
          for s in core tasks charts fair reports large bigcharts dashboard analyst workbook novice scale link text columns manual; do
            echo "::group::$s"
            if BASE="http://127.0.0.1:$PORT" node "tests/e2e/$s.e2e.js"; then echo "$s passed"; else echo "::error::$s failed"; failed=1; fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true
